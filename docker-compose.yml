services:
  openai-asr:
    build:
      context: .
      dockerfile: Dockerfile
    image: openai-asr:local
    container_name: openai-asr
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
    gpus: all
    shm_size: "4gb"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 60s
