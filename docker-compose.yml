services:
  server:
    image: whisperx-server
    container_name: WhisperXServer
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    env_file:
      - .env
    ports:
      - "$TRANSCRIBATION_API_PORT:$TRANSCRIBATION_API_PORT"
    volumes:
      - ./models:/app/models
      - ./cache:/root/.cache
      - ./tempfiles:/app/tempfiles
    restart: always
    mem_limit: 16g
    shm_size: 2g
    runtime: nvidia
    ulimits:
      memlock:
        soft: -1
        hard: -1
