name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Ruff lint
        id: ruff
        continue-on-error: true
        run: uv run ruff check . --output-format=concise > ruff-report.txt 2>&1
      - name: Upload Ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report
          path: ruff-report.txt
      - name: Fail on Ruff errors
        if: steps.ruff.outcome == 'failure'
        run: |
          cat ruff-report.txt
          exit 1
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python -m compileall -q app
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config
