[project]
name = "openai-asr"
version = "1.0.0"
description = "OpenAI-compatible multilingual ASR orchestration with diarization, per-segment alignment and speaker embeddings"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Eldar Boltachev" }]
dependencies = [
    "fastapi>=0.133.0,<1.0",
    "httpx>=0.28.1,<1.0",
    "numpy>=2.0,<3.0",
    "pydantic>=2.12.0,<3.0",
    "python-multipart>=0.0.22,<1.0",
    "pyannote.audio>=4.0.0,<5.0",
    "torch>=2.8.0,<3.0",
    "torchaudio>=2.8.0,<3.0",
    "uvicorn[standard]>=0.41.0,<1.0",
    "whisperx>=3.8.6,<4.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18.0,<2.0",
    "pytest>=8.4.0,<9.0",
    "pytest-asyncio>=1.2.0,<2.0",
    "ruff>=0.12.0,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["tests"]
